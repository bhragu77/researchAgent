# Render Blueprint: single free web service, no A2A agent.
#
# The full architecture (deploy/docker-compose.yml, and the fuller version of
# this file in git history) runs the external-research agent as its own
# process on a private service, so it can't be hit directly and spend the
# search budget. That needs a paid instance type -- Render's free plan
# supports neither Private Services nor enough memory to comfortably run a
# second model-resident process alongside this one.
#
# This version trades that away for $0/month: EXTERNAL_AGENT_URL is left
# unset, so it defaults to a loopback address nothing is listening on.
# app/orchestration/nodes/manager.py already treats a failed external-agent
# call as "this one sub-question found no evidence" rather than a hard
# failure (see `except A2AClientError` / the broad `except Exception` around
# the dispatch call) -- internal-document questions answer normally, only
# comparisons against named outside vendors lose that source and answer from
# whatever internal evidence exists, or abstain if there's truly none.
#
# Free tier is 512MB RAM; the Docker image bakes in ~500MB of embedding/
# rerank models (see deploy/Dockerfile) that load into memory on startup, so
# expect this to be tight -- occasional restarts under load are the realistic
# failure mode, not a hard crash on deploy. It also spins down after 15
# minutes idle, so the first request after a quiet period takes 30-60s to
# wake back up. Upgrading `plan: free` to `standard` below (and optionally
# adding the a2a service back from git history) removes both limits once
# you're ready to pay for it.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo on the `feature/render-neon-deploy` branch. Fill in the `sync: false`
# secrets it prompts for.
#
# After first deploy, run once against Neon (from your own machine, with
# POSTGRES_URL pointed at Neon):
#   python -m scripts.ingest --reset
#   python -m scripts.seed_metrics --reset
# and run `python -m scripts.preflight --prod` before calling it live.

services:
  # Public: API + built UI, single origin.
  - type: web
    name: research-agent-app
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # --- Datastores: external, unmanaged. Paste real values in the dashboard. ---
      - key: POSTGRES_URL # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/dbname?sslmode=require
        sync: false
      - key: REDIS_URL # Upstash connection string, rediss://default:pass@xxx.upstash.io:6379
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: research-agent
      - key: JWT_AUDIENCE
        value: research-api
      - key: ENABLE_DEV_TOKEN_ENDPOINT
        value: "false" # MUST be false once this is public -- see .env.example
      - key: ENABLE_GUEST_MODE
        value: "true"

      # --- OAuth: update the provider consoles' redirect URIs to match the
      # real onrender.com URL (or custom domain) once it's known. ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OAUTH_PUBLIC_BASE_URL
        fromService:
          name: research-agent-app
          type: web
          property: host
      - key: OAUTH_FRONTEND_URL
        fromService:
          name: research-agent-app
          type: web
          property: host

      # --- LLM providers ---
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_JUDGE_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIER
        value: groq

      # --- Serving ---
      - key: SERVE_UI
        value: "true"
      - key: STATIC_DIR
        value: web/dist
      - key: CORS_ALLOW_ORIGINS
        value: ""
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ANSWER_CACHE_ENABLED
        value: "true"

      # --- Tracing (optional; app runs fine without it) ---
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
